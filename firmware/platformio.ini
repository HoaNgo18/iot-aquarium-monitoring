[platformio]
default_envs = esp32-fake

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time
build_flags = -Wall -Wextra

[env:esp32-fake]
build_flags = ${env.build_flags} -DAQUARIUM_FAKE_SENSORS=1

[env:esp32-sensors]
build_flags = ${env.build_flags} -DAQUARIUM_FAKE_SENSORS=0
lib_deps =
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0

; Compatibility alias for the previous environment name.
[env:esp32-pending-sensors]
extends = env:esp32-sensors
